# Clipboard command is picked per platform: pbcopy on macOS, wl-copy under
# Wayland, xclip under X11. Falls back to tmux's own buffer if none exist.
if-shell "command -v pbcopy"  'set -g @CLIP "pbcopy"'
if-shell "command -v wl-copy" 'set -g @CLIP "wl-copy"'
if-shell "command -v xclip"   'set -g @CLIP "xclip -selection clipboard -i"'

# Minimal tmux config for `vpn tui`. It runs on a dedicated server socket
# (tmux -L vpntui), so none of this touches the user's own tmux setup.
#
# The point is a usable side-pane TUI with normal copy/paste: drag to select in
# a pane and it goes straight to the macOS clipboard.

set -g mouse on             # wheel-scroll history, click to focus a pane, drag to select
set -g set-clipboard on     # also mirror copies to the terminal clipboard (OSC 52)
set -g status off           # no tmux status bar -- this is a single-purpose UI
set -g escape-time 0        # snappy Esc in fzf
set -g history-limit 50000  # keep plenty of log scrollback

# Drag-select copies to the macOS clipboard and clears the selection.
bind -T copy-mode    MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@CLIP}"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "#{@CLIP}"
# Double-click a word / triple-click a line, also to the clipboard.
bind -T copy-mode    DoubleClick1Pane  select-pane \; send -X select-word \; send -X copy-pipe-and-cancel "#{@CLIP}"
bind -T copy-mode    TripleClick1Pane  select-pane \; send -X select-line \; send -X copy-pipe-and-cancel "#{@CLIP}"
