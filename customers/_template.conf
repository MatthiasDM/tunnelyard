# Copy to customers/<name>.conf and fill in. One file per customer.
#
# Plain KEY=value only -- this file is read both by docker --env-file and by a
# small sed parser in bin/tunnelyard, so no shell expansion, and no trailing comments
# on a value line. Passwords are never stored here; they are prompted for.

# --- required ---------------------------------------------------------------

# Distinct localhost port per customer. This is where the SOCKS5 proxy lands on
# your Mac; several customers can be up at once because each gets its own port.
SOCKS_PORT=1081

# openconnect | openfortivpn | openvpn | wireguard
VPN_KIND=openconnect

# For VPN_KIND=openconnect, pick the protocol matching the vendor client:
#   anyconnect  Cisco AnyConnect / Secure Client
#   gp          Palo Alto GlobalProtect
#   pulse       Ivanti Secure Access / Pulse Connect Secure
#   f5          F5 BIG-IP APM
#   fortinet    FortiGate SSL VPN
#   nc          Juniper Network Connect
#   array       Array Networks
VPN_PROTOCOL=anyconnect

# Gateway. Hostname or https:// URL.
VPN_SERVER=vpn.example.com

# --- usually wanted ---------------------------------------------------------

VPN_USER=

# --- 1Password (optional) ---------------------------------------------------
# Auto-fill credentials from 1Password at connect. Needs the op CLI app
# integration on (1Password app -> Settings -> Developer). OP_ITEM points at the
# item (name, UUID, or an op://vault/item reference); its username fills VPN_USER
# if VPN_USER is blank, its password is typed at the prompt, and OP_OTP=1 types
# the item's current TOTP at the 2FA prompt. Secrets go straight into the client
# (never the container env). Applies to openconnect-based customers.
# OP_ITEM=op://Private/Example VPN
# OP_OTP=1
OP_ITEM=
OP_OTP=0

# Fixed TCP forwards, comma separated: lport:remotehost:rport
# Each lport is also published on 127.0.0.1, so an app on your Mac reaches an
# internal host directly with no proxy configuration. Handy for MLLP, SFTP,
# database and admin endpoints.
# FORWARDS=2575:10.20.5.40:2575,2222:10.20.5.41:22
FORWARDS=

# --- health & keepalive (optional) ------------------------------------------
# A running container is not a working tunnel: when a gateway expires the
# session server-side, the client keeps its transport up and every packet sent
# into the tunnel is silently dropped. `tunnelyard status`, `tunnelyard health` and the TUI
# therefore probe the data path rather than trusting the container.
#
# HEALTH_PROBE is the host:port they connect to. It defaults to the first
# FORWARDS entry, so most customers need nothing here; set it when there are no
# forwards, or to aim at a host that is more reliably up. A refused connection
# still counts as healthy -- the RST proves the tunnel carries return traffic.
# HEALTH_PROBE=10.20.5.40:443
HEALTH_PROBE=

# KEEPALIVE_INTERVAL > 0 sends real traffic through the tunnel that often (in
# seconds) to stop the gateway's idle timer from expiring the session. The
# client's own protocol keepalives do not count for this -- gateways like F5 APM
# measure user traffic. Pick a value comfortably under the server's timeout; the
# tunnel logs it at connect ("Idle timeout is N minutes"). Defaults to the same
# target as HEALTH_PROBE.
#
# Leave at 0 unless a customer actually times you out: an always-alive session
# may be at odds with the customer's own security policy.
KEEPALIVE_INTERVAL=0
KEEPALIVE_TARGET=

# F5 scripted-login customers only (VPN_F5_SCRIPTED=1). Seconds between HTTPS
# polls of the gateway carrying the APM session cookie; 0 (default) disables.
# Some F5 policies expire the APM session on HTTP inactivity and ignore tunnel
# traffic entirely -- for those, KEEPALIVE_INTERVAL above cannot help and this
# is the setting that keeps the session alive. Each poll logs whether the
# session is still valid, so a tunnel that goes stale can be attributed to the
# session expiring rather than the transport breaking.
F5_SESSION_KEEPALIVE=0
# Override the polled URL if the default is not right for a policy.
# F5_SESSION_URL=

# --- RDP (browser-based; optional) ------------------------------------------
# Default target for `tunnelyard rdp <customer>` and the TUI's ^t. With these set you
# never retype the server or username -- just the password at connect. Prefer an
# IP for RDP_SERVER. The RDP session is torn down automatically when you stop
# the tunnel.
# RDP_SERVER=10.20.0.5
# RDP_USER=DOMAIN\user
# RDP_GEOMETRY=1440x900
RDP_SERVER=
RDP_USER=

# --- custom commands (optional) ---------------------------------------------
# CMD_<label>=<command> defines a command runnable from the TUI (^n) or with
# `tunnelyard run <customer> <label>`. It runs INSIDE the tunnel container, so it can
# reach internal hosts directly -- a plain ssh to an internal IP just works
# (the image has an ssh client). Add more from the TUI's ^n -> "add new".
# CMD_app=ssh -o StrictHostKeyChecking=accept-new user@10.20.0.9
# CMD_db=ssh -o StrictHostKeyChecking=accept-new dba@10.20.0.10

# --- optional ---------------------------------------------------------------

# Client OS reported to the gateway. Some policies gate on this.
# linux | linux-64 | win | mac-intel | android | apple-ios
VPN_OS=mac-intel

# Tunnel group / realm, if the gateway asks for one.
VPN_AUTHGROUP=

# Set to 1 if the gateway hands out DNS servers that its own split tunnel does
# not route to -- a common mismatch that leaves every lookup timing out. Check
# with: tunnelyard shell <customer>, then compare 'ip route' against /etc/resolv.conf.
# Leave off unless you have that symptom; a strict policy will drop the traffic
# anyway and the extra route just hides the problem.
VPN_ROUTE_DNS=0

# Set to 1 to authenticate with an existing session cookie pasted on stdin
# instead of username+password. Needed when the portal login must happen in a
# real browser (SAML, or an endpoint-inspection step). See riverside.conf.
VPN_COOKIE=0

# Client certificate auth. Put the files in ./config, which is mounted at
# /config inside the container.
VPN_CERT=
VPN_KEY=

# Pin the gateway certificate, e.g. pin-sha256:xxxx. openconnect prints the
# exact value to use on first connect.
VPN_SERVERCERT=

# Extra flags passed verbatim to the client. Word-split, so no quoting.
# Useful ones:
#   --external-browser=/usr/bin/xdg-open   SAML logins
#   --no-dtls                              when UDP is blocked
VPN_EXTRA=

# For VPN_KIND=openvpn or wireguard: config path inside the container.
# VPN_CONFIG=/config/client.ovpn
VPN_CONFIG=
